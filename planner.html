<body><main class="content" id="main"><h1>المخطط الدراسي</h1>

<h2 style="margin-top:24px">الأسبوع الحالي</h2><div id="week" class="week"></div>
<section class="card" style="margin-top:16px"><h2>مهام اليوم</h2><div id="daily"></div></section></main>
