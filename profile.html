supabase.jsscript>

<script>
(async () => {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    location.href = "login.html";
    return;
  }

  profileEmail.value = user.email;

  const { data } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if (data) {
    fullName.value = data.full_name || "";
    studentId.value = data.student_id || "";
    major.value = data.major || "";

    if (data.college)
      college.value = data.college;

    if (data.study_year)
      year.value = data.study_year;
  }

  updatePreview();

  profileForm.onsubmit = async (e) => {
    e.preventDefault();

    const { error } =
      await supabaseClient
      .from("profiles")
      .upsert({
        id: user.id,
        full_name: fullName.value,
        student_id: studentId.value,
        college: college.value,
        major: major.value,
        study_year: year.value
      });

    if (error) {
      message.textContent = error.message;
      return;
    }

    updatePreview();
    message.textContent =
      "تم حفظ البيانات بنجاح";
  };

})();

function updatePreview() {

  displayName.textContent =
    fullName.value ||
    "طالب جامعة البحرين";

  displayMajor.textContent =
    major.value ||
    "لم يتم تحديد التخصص";

  avatar.textContent =
  (
    fullName.value
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    || "U"
  ).toUpperCase();
}

logout.onclick = async () => {

  await supabaseClient.auth.signOut();

  location.href = "login.html";
};
</script>
