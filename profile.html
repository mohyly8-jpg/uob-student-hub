<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الملف الشخصي | UOB Student Hub</title><meta name="description" content="حدّث بياناتك الأكاديمية.">
<meta property="og:title" content="الملف الشخصي | UOB Student Hub"><meta property="og:description" content="حدّث بياناتك الأكاديمية."><meta name="theme-color" content="#172554">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body><main class="content" id="main"><h1>الملف الشخصي</h1><form id="pform" class="card" style="max-width:560px">
<label for="full_name">الاسم الكامل</label><input id="full_name" required><label for="student_id">الرقم الجامعي</label><input id="student_id" inputmode="numeric" dir="ltr">
<label for="college">الكلية</label><input id="college"><label for="major">التخصص</label><input id="major">
<label for="academic_year">السنة الدراسية</label><select id="academic_year"><option value="">اختر</option><option>الأولى</option><option>الثانية</option><option>الثالثة</option><option>الرابعة</option><option>الخامسة</option></select>
<label for="email">البريد الإلكتروني</label><input id="email" readonly dir="ltr"><button class="btn" style="margin-top:16px">حفظ</button></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script><script src="js/main.js"></script><script src="js/profile.js"></script></body></html>
