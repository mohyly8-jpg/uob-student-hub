<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172554">
  <link rel="stylesheet" href="styles.css">
  <title>تسجيل الدخول | UOB Student Hub</title>
</head>

<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark">U</span>
    <span>
      <strong>UOB Student Hub</strong>
      <small>منصة طلابية مستقلة</small>
    </span>
  </a>

  <div class="header-actions" style="margin-inline-start:auto">
    <button class="lang-btn" data-lang-toggle>EN</button>
    <a class="profile-link" href="profile.html">الملف الشخصي</a>
    <a class="outline-btn" href="index.html">الرئيسية</a>
  </div>
</header>

<main class="auth-shell">

  <section class="auth-card">

    <span class="eyebrow">UOB Student Hub</span>

    <h1>تسجيل الدخول إلى حسابك</h1>

    <p>
      ليس لديك حساب؟ يمكنك استخدام النموذج التجريبي مباشرة.
    </p>

    <form id="loginForm">

      <label>
        البريد الإلكتروني
        <input
          id="email"
          type="email"
          required
          placeholder="name@example.com">
      </label>

      <label>
        كلمة المرور
        <input
          id="password"
          type="password"
          minlength="6"
          required
          placeholder="••••••••">
      </label>

      <button
        class="primary-btn"
        type="submit">

        دخول

      </button>

      <p
        class="auth-message"
        id="message">
      </p>

    </form>

    <a
      class="back-link"
      href="index.html">

      العودة إلى الرئيسية

    </a>

  </section>

</main>

<script src="i18n.js"></script>

<script>

document
.getElementById("loginForm")
.onsubmit = (e) => {

  e.preventDefault();

  localStorage.setItem(
    "uobUser",
    JSON.stringify({
      email: email.value,
      loggedIn: true
    })
  );

  message.textContent =
    "مرحبًا بك";

  setTimeout(() => {

    location.href =
      "profile.html";

  }, 500);

};

</script>

</body>
</html>
