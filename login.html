<meta charset="UTF-8">

<meta property="og:title" content="تسجيل الدخول | UOB Student Hub">

<body><main class="auth">
  <div class="card"><h1>تسجيل الدخول</h1>
<form id="login-form">
  <label for="email">البريد الإلكتروني</label>
  <input id="email" type="email" required autocomplete="email" dir="ltr">
<label for="password">كلمة المرور</label><input id="password" type="password" required autocomplete="current-password" dir="ltr">
<div class="row"><label><input id="remember" type="checkbox" checked> تذكرني</label>
  <a href="#" id="forgot">نسيت كلمة المرور؟</a>
</div>
<button class="btn" type="submit">دخول</button><div id="msg" role="alert">
  
</div></form>
<p style="text-align:center;margin-top:16px">ليس لديك حساب؟ <a href="register.html">سجّل الآن</a></p></div></main>
