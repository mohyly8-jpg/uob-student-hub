<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172554">
<link rel="stylesheet" href="styles.css">
<title>تسجيل الدخول | UOB Student Hub</title>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark">U</span>
    <span>
      <strong>UOB Student Hub</strong>
      <small>منصة طلابية مستقلة</small>
    </span>
  </a>

  <div class="header-actions" style="margin-inline-start:auto">
    <a class="outline-btn" href="index.html">الرئيسية</a>
  </div>
</header>

<main class="auth-shell">
  <section class="auth-card">

    <span class="eyebrow">UOB Student Hub</span>

    <h1>تسجيل الدخول</h1>

    <p>
      سجل الدخول أو أنشئ حساباً جديداً لحفظ بياناتك وجدولك الدراسي.
    </p>

    <form id="loginForm">

      <label>
        البريد الإلكتروني
        <input
          id="email"
          type="email"
          required
          placeholder="name@example.com">
      </label>

      <label>
        كلمة المرور
        <input
          id="password"
          type="password"
          minlength="6"
          required
          placeholder="••••••••">
      </label>

      <div style="display:flex;gap:10px;margin-top:15px;flex-wrap:wrap">

        <button
          class="primary-btn"
          type="submit">
          تسجيل الدخول
        </button>

        <button
          class="outline-btn"
          type="button"
          id="registerBtn">
          إنشاء حساب
        </button>

      </div>

      <p
        id="message"
        class="auth-message">
      </p>

    </form>

    <a class="back-link" href="index.html">
      العودة إلى الرئيسية
    </a>

  </section>
</main>

<script src="https://cdn.npm/@supabase/supabase-js@2script>

<script src="supabase.jsipt>

(async () => {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (session) {
    location.href = "profile.html";
  }

})();

const form =
document.getElementById("loginForm");

const registerBtn =
document.getElementById("registerBtn");

const message =
document.getElementById("message");

form.addEventListener(
  "submit",
  async (e) => {

    e.preventDefault();

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    message.textContent =
      "جاري تسجيل الدخول...";

    const { error } =
      await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });

    if (error) {

      message.textContent =
        error.message;

      return;
    }

    message.textContent =
      "تم تسجيل الدخول بنجاح";

    location.href =
      "profile.html";
  }
);

registerBtn.addEventListener(
  "click",
  async () => {

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      message.textContent =
        "أدخل البريد الإلكتروني وكلمة المرور أولاً";

      return;
    }

    message.textContent =
      "جاري إنشاء الحساب...";

    const { error } =
      await supabaseClient.auth.signUp({
        email,
        password
      });

    if (error) {

      message.textContent =
        error.message;

      return;
    }

    message.textContent =
      "تم إنشاء الحساب بنجاح. تحقق من بريدك الإلكتروني إذا كان التفعيل مطلوباً.";
  }
);

</script>

</body>
</html>
